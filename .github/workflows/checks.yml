name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controller, UI, grounding and campaign tests
        run: python -m unittest tests.test_t4 tests.test_t5 tests.test_t6_controller tests.test_t7 tests.test_prefreeze tests.test_t8 tests.test_reliability
      - name: Compile Python sources
        run: python -m compileall -q src fixture evaluation probes scripts tests
      - name: Verify static publishing artifact
        run: python scripts/check-site.py
